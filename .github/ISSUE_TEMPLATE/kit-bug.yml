name: Problem with the kit or docs
description: Something in the kit, cs-check, the samples or the docs is wrong or unclear
labels: ["kit"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Kit version and Node version
      placeholder: "kit 1.0.0, Node 20.11"
