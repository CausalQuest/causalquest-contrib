name: Contributor agreement
# Asks each pull request author to accept CausalQuest-CLA-1 once, by comment, and records the acceptance
# (account, version, time) in signatures/CausalQuest-CLA-1.json on the cla-signatures branch.
# Runs on pull_request_target so it can comment on pull requests from forks; it never checks out or runs their code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # The check is named "CLA Assistant": the "Protect main" ruleset requires a check with exactly this name.
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Check the contributor agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read and accept CausalQuest-CLA-1') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/CausalQuest/causalquest-contrib/blob/main/CLA.md
          path-to-signatures: signatures/CausalQuest-CLA-1.json
          branch: cla-signatures
          allowlist: jdsouza10,Claude,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read and accept CausalQuest-CLA-1
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before we can review it, please read the
            [CausalQuest Contributor Agreement (CausalQuest-CLA-1)](https://github.com/CausalQuest/causalquest-contrib/blob/main/CLA.md)
            and accept it by posting the comment below. You only need to do this once.
          custom-allsigned-prcomment: All authors of this pull request have accepted CausalQuest-CLA-1. Thank you.
          lock-pullrequest-aftermerge: false
